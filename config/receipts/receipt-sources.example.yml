# Receipt collector — konfiguration
#
# Kopiera till  config/receipt-sources.yml  (sökvägen cmd/receipts-collector
# faktiskt läser) och fyll i dina värden. Filen är gitignorerad.
#
# Lägg ALDRIG ett lösenord i den här filen. Konton anger `password_env`, alltså
# NAMNET på en miljövariabel; värdet hämtas från miljön vid start.
#
# Schemat här är asserterat mot binärens egna structs av
# TestExampleConfigLoadsIntoTheStructsThisBinaryUses. yaml.v3 ignorerar okända
# fält, så en exempelfil som glidit isär från koden ger en tom konfiguration och
# en collector som tyst gör ingenting — därför testas det istället för att läsas.

# ---------------------------------------------------------------------------
# Fortnox-databasens identifierare.
#
# Arkivadresserna nedan MÅSTE bära det här numret. Validate() vägrar annars
# ladda konfigurationen — ett fel i en arkivadress ger varken felmeddelande
# eller resultat: vidarebefordran lyckas och dokumentet dyker aldrig upp i
# Fortnox. Tio leverantörsfakturor gick till en pensionerad databas efter en
# Fortnox-migrering våren 2024 (#80).
# ---------------------------------------------------------------------------
# Sifferplatshållare, inte "DITT-ORGNR": exempelfilen måste kunna laddas, och
# TestExampleConfigLoads asserterar det. En bokstavsplatshållare bryter mot
# guarden nedan och gör exemplet ovaliderbart.
fortnox_id: "0000000"

# ---------------------------------------------------------------------------
# Mailkonton (IMAP)
#
# Hämtas alltid med PEEK, så inga \Seen-flaggor ändras vid läsning. Ett mail
# markeras som läst först när det vidarebefordrats (se Collector.markSeen).
# ---------------------------------------------------------------------------
sources:
  - name: personal-gmail
    host: imap.gmail.com
    port: 993
    tls: true
    username: din.adress@gmail.com
    password_env: GMAIL_APP_PASSWORD_PERSONAL # App-lösenord, inte kontolösenord
    folder: INBOX

  # Ytterligare konton får varsin egen env-variabel — dela aldrig en.
  # - name: work-gmail
  #   host: imap.gmail.com
  #   port: 993
  #   tls: true
  #   username: jobb.adressen@gmail.com
  #   password_env: GMAIL_APP_PASSWORD_WORK
  #   folder: INBOX

# ---------------------------------------------------------------------------
# Destinationer
#
# type: smtp              — vidarebefordran via SMTP till `address`
#       fortnox-receipts  — uppladdning till Fortnox kvitto-inbox
#       fortnox-invoices  — uppladdning till Fortnox leverantörsfaktura-inbox
# ---------------------------------------------------------------------------
destinations:
  - name: mynt
    type: smtp
    address: kvitto+DITT-HASH@mynt.se

  - name: fortnox-receipts
    type: smtp
    address: inbox.ver.0000000@arkivplats.se

  - name: fortnox-invoices
    type: smtp
    address: inbox.lev.0000000@arkivplats.se

# ---------------------------------------------------------------------------
# Routingregler — utvärderas i ordning, första träff vinner.
#
# match_from     — exakt adress, eller *@domän
# match_subject  — delsträng, skiftlägesokänslig
#
# Kriterier ANDas; alternativ inom ett kriterium ORas. En regel som anger både
# match_from och match_subject kräver alltså BÅDA. Utelämnat kriterium är inte
# en begränsning, så en regel med bara match_from matchar oavsett ämnesrad.
#
# destination: ""  — släng uttryckligen (regeln matchar, inget vidarebefordras)
# ---------------------------------------------------------------------------
rules:
  # --- Släng först: en droppregel efter en bredare regel nås aldrig ---
  # --- Släng först: en droppregel efter en bredare regel nås aldrig ---
  #
  # Dessa avsändare skickar BÅDE kvitton och säkerhetslarm/produktmail från
  # samma adress. Sender-only-reglerna nedan skulle annars boka larmen.
  # Hittade i en skarp dry run 2026-09-09.
  - name: ignore-security-alerts
    match_subject: ["security alert", "sign-in alert", "säkerhetsavisering", "new passkey", "new trusted device",
                    "new device sign-in", "inloggning på ny enhet", "privacy notice"]
    destination: ""

  - name: ignore-cancellations
    match_subject: ["cancelled", "canceled", "avbokad", "avbokning", "makulerad"]
    destination: ""

  - name: ignore-no-invoice-raised
    match_subject: ["minimum invoice amount not reached"]
    destination: ""

  # En misslyckad betalning är ingen kostnad att bokföra — den skulle registrera
  # ett köp som aldrig skedde. Hör hemma i forfall, inte i bokföringen.
  - name: ignore-failed-payments
    match_subject: ["payment failed", "betalning misslyckades", "payment declined"]
    destination: ""

  # Förhandsavisering om ett kommande kortköp. Kostnaden finns inte ännu —
  # det riktiga kvittot kommer när kortet faktiskt dras.
  - name: ignore-upcoming-charges
    match_subject: ["kommande kortbetalning", "upcoming payment", "upcoming charge", "kommande betalning",
                    "your upcoming", "din kommande", "please pay for your booking", "charging your card soon"]
    destination: ""

  - name: ignore-apple-price-change
    match_from: ["*@email.apple.com"]
    match_subject: ["price change", "prisändring"]
    destination: ""

  # Mätt 2026-09-10 mot 11 månader riktig post: 16 558 meddelanden, 143 kvitton
  # som Mathias vidarebefordrat för hand, 156 som reglerna skulle skicka — varav
  # ~68 inte var kvitton. Dessa droppregler och ämnesvillkoren nedan är svaret.
  # Regressionsskyddet ligger i TestExampleRules_doNotRouteTheseMeasuredFalsePositives.
  - name: ignore-review-requests
    match_subject: ["waiting for your review", "väntar på din recension", "rate ", "betygsätt", "hjälp oss att bli bättre"]
    destination: ""

  - name: ignore-inbox-messages
    match_subject: ["you have a message from", "du har ett meddelande från"]
    destination: ""

  # En bokad resa eller order är inte en kostnad. Kvittot kommer när den utförs.
  - name: ignore-reservations-and-orders
    match_subject: ["reservation confirmed", "orderbekräftelse", "tack för din beställning"]
    destination: ""

  - name: ignore-verification-codes
    match_subject: ["verifieringskod", "verification code", "your code is"]
    destination: ""

  # ERP-flödesmail. Att bli ombedd att ANGE ett fakturanummer är inte en faktura.
  - name: ignore-erp-workflow-prompts
    match_subject: ["please enter your supplier invoice numbers", "requisition"]
    destination: ""

  # --- Leverantörsfakturor → Fortnox ---
  - name: hetzner-invoice
    match_from: ["*@hetzner.com"]
    match_subject: ["Invoice", "Faktura"]
    destination: fortnox-invoices

  # Sender-only routade orderbekräftelser och supportärenden hit.
  - name: bahnhof-invoice
    match_from: ["*@bahnhof.se"]
    match_subject: ["faktura", "invoice"]
    destination: fortnox-invoices

  - name: telenor-invoice
    match_from: ["*@telenor.se"]
    match_subject: ["faktura", "invoice"]
    destination: fortnox-invoices

  # 12 av 12 telia-mail på 11 månader var marknadsföring eller
  # orderbekräftelser, noll fakturor — de kommer via Kivra.
  - name: telia-invoice
    match_from: ["*@telia.se"]
    match_subject: ["faktura", "invoice"]
    destination: fortnox-invoices

  # BMW Financial Services kommer via Kivra-vidarebefordran, så avsändaren är
  # Kivra och inte BMW — matcha på ämnesraden också.
  - name: bmw-financial-services
    match_from: ["*@kivra.com", "*@kivra.se"]
    match_subject: ["BMW"]
    destination: fortnox-invoices

  # Sender-only här är säkert först efter droppregeln ignore-erp-workflow-prompts:
  # samma avsändare skickar både fakturor och arbetsflödespåminnelser.
  - name: workforcelogiq-invoice
    match_from: ["*@workforcelogiq.com"]
    match_subject: ["invoice", "faktura"]
    destination: fortnox-invoices

  # Sender-only routade vanlig mänsklig mail om en PRIVAT pension in i bolagets
  # leverantörsfakturainkorg — 16 meddelanden på 11 månader, noll fakturor.
  # Rådgivare mailar från namngivna adresser på samma domän.
  - name: soderberg-partners
    match_from: ["*@soderbergpartners.se"]
    match_subject: ["faktura", "invoice"]
    destination: fortnox-invoices

  # --- Korttransaktioner → Mynt ---
  # Google sends payment receipts from payments-noreply@ under subjects well
  # outside the two originally listed. Match the payments sender on its own and
  # keep the subject constraint only for the general google.com address, which
  # also carries account and product mail.
  - name: google-payments-receipt
    match_from: ["payments-noreply@google.com"]
    match_subject: ["faktura", "invoice", "kvitto", "receipt", "betalning", "payment"]
    destination: mynt

  - name: google-play-receipt
    match_from: ["*@google.com"]
    match_subject: ["Kvitto på din beställning", "Google Play order receipt", "payment receipt"]
    destination: mynt

  # The subject allowlist was too narrow — three forwarded Apple receipts
  # matched none of it. "receipt"/"kvitto"/"faktura" covers the variants without
  # opening the rule to Apple's marketing, which the drop rule above catches.
  - name: apple-receipt
    match_from: ["*@email.apple.com"]
    match_subject: ["invoice", "faktura", "kvitto", "receipt"]
    destination: mynt

  - name: amazon-receipt
    match_from: ["*@amazon.se", "*@amazon.com"]
    match_subject: ["Your order", "Din beställning", "order confirmation"]
    destination: mynt

  - name: spotify-receipt
    match_from: ["*@spotify.com"]
    match_subject: ["receipt", "kvitto"]
    destination: mynt

  # support@easypark.net är kundtjänstärenden, inte kvitton.
  - name: easypark-receipt
    match_from: ["no-reply@easypark.net", "noreply@easypark.net"]
    match_subject: ["receipt", "kvitto"]
    destination: mynt

  # Parkster is a .se domain. The .com pattern never matched a single message.
  # "Uppskjuten debitering" är ett besked om en kommande dragning.
  - name: parkster-receipt
    match_from: ["*@parkster.se", "*@parkster.com"]
    match_subject: ["kvitto", "receipt", "faktura"]
    destination: mynt

  - name: nextory-receipt
    match_from: ["*@nextory.com"]
    destination: mynt

  - name: bonnier-svd-receipt
    match_from: ["*@bonniernews.se", "*@svd.se"]
    destination: mynt

  - name: sats-receipt
    match_from: ["*@sats.com"]
    destination: mynt

  - name: berget-receipt
    match_from: ["*@berget.ai"]
    match_subject: ["receipt", "invoice", "faktura", "kvitto"]
    destination: mynt

  - name: perplexity-receipt
    match_from: ["*@perplexity.ai"]
    destination: mynt

  - name: elevenlabs-receipt
    match_from: ["*@elevenlabs.io"]
    destination: mynt

  # Invoices arrive from the mail.anthropic.com SUBDOMAIN. `*@anthropic.com`
  # matches the apex only, so this rule matched nothing for its whole life.
  - name: anthropic-receipt
    match_from: ["*@anthropic.com", "*@mail.anthropic.com"]
    match_subject: ["receipt", "invoice", "faktura", "kvitto"]
    destination: mynt

  # --- Betalningsförmedlare (köpmannen står i ämnesraden, inte avsändaren) ---
  # Ground truth: 2026-09-09 audit of 209 receipts forwarded by hand to Mynt.
  # 39 senders matched no rule at all; these are the ones that recurred.
  - name: stripe-receipt
    match_from: ["*@stripe.com"]
    destination: mynt

  - name: paddle-receipt
    match_from: ["*@paddle.com"]
    destination: mynt

  - name: zettle-receipt
    match_from: ["*@zettle.com"]
    destination: mynt

  # --- Resor, parkering, vägavgifter ---
  # uber@ och ubereats@ är ren marknadsföring; no-reply@ skickar
  # bokningsbekräftelser. Kvittona kommer alltid från noreply@ med resan i
  # ämnesraden — 11 av 11 vidarebefordrade för hand ser ut så.
  - name: uber-receipt
    match_from: ["noreply@uber.com"]
    match_subject: ["trip with uber", "resa med uber", "kvitto", "receipt"]
    destination: mynt

  - name: sas-receipt
    match_from: ["*@flysas.com"]
    destination: mynt

  # Booking.com skickar kvitton från HOTELLETS adress under
  # property.booking.com. Apexdomänen (noreply@, noreply-iam@,
  # noreply-payments@, customer.service@) skickar recensionsförfrågningar,
  # verifieringskoder, marknadsföring och bokningsbekräftelser — 45 av dem på 11
  # månader och inte ett enda kvitto som vidarebefordrats för hand. En
  # bokningsbekräftelse är inte heller ett kvitto: kostnaden uppstår vid
  # betalning, och betalningen kommer i ett eget mail.
  # noreply-payments@ fanns i handvidarebefordringsrevisionen (209 kvitton, längre
  # historik än mätfönstret 2025-10→2026-09). Behåll den — men på ämnesrad, inte
  # på avsändare: samma adress skickar "Please pay for your booking now", som
  # droppregeln ignore-upcoming-charges fångar först.
  - name: booking-payment-receipt
    match_from: ["noreply-payments@booking.com"]
    match_subject: ["payment", "betalning", "kvitto", "receipt", "faktura", "invoice"]
    destination: mynt

  - name: booking-property-receipt
    match_from: ["*@property.booking.com"]
    match_subject: ["bill ", "kvitto", "receipt", "betalningsbekräftelse", "faktura", "invoice"]
    destination: mynt

  - name: omio-receipt
    match_from: ["*@omio.com"]
    destination: mynt

  - name: aimopark-receipt
    match_from: ["*@aimopark.io"]
    destination: mynt

  - name: taxistockholm-receipt
    match_from: ["*@taxistockholm.se"]
    destination: mynt

  - name: asfinag-receipt
    match_from: ["*@asfinag.at"]
    destination: mynt

  # --- SaaS ---
  - name: onepassword-receipt
    match_from: ["*@1password.com"]
    match_subject: ["receipt", "invoice", "faktura", "kvitto"]
    destination: mynt

  # Mistral sends from two different subdomains — a merchant list reliably
  # misses the second one.
  # mistral-news@ ligger på samma domän som fakturorna.
  - name: mistral-receipt
    match_from: ["*@mistral.ai", "*@emails.mistral.ai"]
    match_subject: ["faktura", "invoice", "kvitto", "receipt"]
    destination: mynt

  - name: github-receipt
    match_from: ["*@github.com"]
    match_subject: ["receipt", "payment", "invoice"]
    destination: mynt

  - name: audible-receipt
    match_from: ["*@audible.com"]
    match_subject: ["receipt", "kvitto", "order"]
    destination: mynt

  # Kvittona kommer från BÅDE apexdomänen och mg-subdomänen.
  - name: evernote-receipt
    match_from: ["*@evernote.com", "*@mg.evernote.com"]
    destination: mynt

  # Långa svansen, funnen i mätningen 2026-09-10 som handvidarebefordringar utan
  # matchande regel.
  - name: power-receipt
    match_from: ["*@power.se"]
    match_subject: ["kvitto", "faktura", "receipt", "invoice"]
    destination: mynt

  - name: purspot-receipt
    match_from: ["*@purspot.com"]
    match_subject: ["payment", "betalning", "kvitto", "receipt"]
    destination: mynt

  # --- Kvitton utan kortknytning → Fortnox ---
  - name: wolt-receipt
    match_from: ["*@wolt.com"]
    destination: fortnox-receipts
