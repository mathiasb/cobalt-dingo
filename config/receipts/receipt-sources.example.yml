# Receipt Collector – konfigurationsschema
#
# Kopiera till config/receipt-sources.yml och fyll i dina värden.
# Lägg ALDRIG in lösenord här – använd miljövariabler eller secrets-store.
# Se .env.example för tillgängliga env-variabler.

# ---------------------------------------------------------------------------
# Mailkonton (IMAP)
# ---------------------------------------------------------------------------
accounts:
  - id: personal-gmail           # Unikt ID, används i routing-regler
    label: "Privat Gmail"
    imap:
      host: imap.gmail.com
      port: 993
      tls: true
      username: "${GMAIL_USER}"         # env-variabel
      password: "${GMAIL_APP_PASSWORD}" # App-lösenord, inte vanligt lösenord
    search_folder: INBOX
    processed_label: coo-agent/processed  # Gmail-label som sätts efter hantering

  # Exempel: ytterligare konto (Fastmail, Proton, etc.)
  # - id: work-fastmail
  #   label: "Jobbmail"
  #   imap:
  #     host: imap.fastmail.com
  #     port: 993
  #     tls: true
  #     username: "${FASTMAIL_USER}"
  #     password: "${FASTMAIL_APP_PASSWORD}"
  #   search_folder: INBOX
  #   processed_label: coo-agent/processed

# ---------------------------------------------------------------------------
# Destinations
# ---------------------------------------------------------------------------
destinations:
  mynt:
    type: email_forward
    address: "${MYNT_RECEIPT_EMAIL}"   # kvitto+<hash>@mynt.se

  fortnox_receipt:
    type: email_forward
    address: "${FORTNOX_RECEIPT_EMAIL}" # inbox.ver.<ditt-orgnr>@arkivplats.se

  fortnox_invoice:
    type: email_forward
    address: "${FORTNOX_INVOICE_EMAIL}" # inbox.lev.<ditt-orgnr>@arkivplats.se

# ---------------------------------------------------------------------------
# Routing-regler
# Utvärderas i ordning – första match vinner.
# Fält: from_domain, from_address, subject_contains, subject_matches (regex)
# Destination: mynt | fortnox_receipt | fortnox_invoice | null (ignorera)
# ---------------------------------------------------------------------------
rules:
  # --- Leverantörsfakturor → Fortnox faktura ---
  - id: hetzner-invoice
    description: "Hetzner månads-/årsräkning"
    match:
      from_domain: hetzner.com
      subject_contains: "Invoice"
    destination: fortnox_invoice

  - id: bahnhof-invoice
    description: "Bahnhof bredbandsräkning"
    match:
      from_domain: bahnhof.se
    destination: fortnox_invoice

  # --- Korttransaktioner → Mynt ---
  - id: google-play-receipt
    description: "Google Play prenumerationskvitto"
    match:
      from_domain: google.com
      subject_contains: "Kvitto på din beställning från Google Play"
    destination: mynt

  - id: apple-receipt
    description: "Apple App Store / iCloud-faktura"
    match:
      from_domain: email.apple.com
      subject_contains_any:
        - "Your invoice from Apple"
        - "Din faktura från Apple"
    destination: mynt

  - id: amazon-receipt
    description: "Amazon orderbekräftelse"
    match:
      from_domain_any:
        - amazon.se
        - amazon.com
      subject_contains_any:
        - "Your order"
        - "Din beställning"
        - "order confirmation"
    destination: mynt

  - id: spotify-receipt
    description: "Spotify månadskvitto"
    match:
      from_domain: spotify.com
      subject_contains: "receipt"
    destination: mynt

  - id: nextory-receipt
    match:
      from_domain: nextory.com
    destination: mynt

  - id: svd-receipt
    description: "Svenska Dagbladet / Bonnier prenumeration"
    match:
      from_domain_any:
        - bonniernews.se
        - svd.se
    destination: mynt

  - id: sats-receipt
    match:
      from_domain: sats.com
    destination: mynt

  - id: berget-receipt
    match:
      from_domain: berget.ai
    destination: mynt

  - id: easypark-receipt
    match:
      from_domain: easypark.net
    destination: mynt

  - id: parkster-receipt
    match:
      from_domain: parkster.com
    destination: mynt

  - id: anthropic-receipt
    description: "Claude Pro / Anthropic"
    match:
      from_domain: anthropic.com
      subject_contains: "receipt"
    destination: mynt

  - id: elevenlabs-receipt
    match:
      from_domain: elevenlabs.io
    destination: mynt

  - id: perplexity-receipt
    match:
      from_domain: perplexity.ai
    destination: mynt

  # --- Kvitton utan kortknytning → Fortnox kvitto ---
  - id: wolt-receipt
    description: "Wolt matleverans – representationskostnad"
    match:
      from_domain: wolt.com
    destination: fortnox_receipt

  # --- Ignorera (ej kvitton) ---
  - id: ignore-apple-price-change
    description: "Prisändringsavisering från Apple – inte ett kvitto"
    match:
      from_domain: email.apple.com
      subject_contains: "price change"
    destination: null
