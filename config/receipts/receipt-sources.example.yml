# Receipt collector — konfiguration
#
# Kopiera till  config/receipt-sources.yml  (sökvägen cmd/receipts-collector
# faktiskt läser) och fyll i dina värden. Filen är gitignorerad.
#
# Lägg ALDRIG ett lösenord i den här filen. Konton anger `password_env`, alltså
# NAMNET på en miljövariabel; värdet hämtas från miljön vid start.
#
# Schemat här är asserterat mot binärens egna structs av
# TestExampleConfigLoadsIntoTheStructsThisBinaryUses. yaml.v3 ignorerar okända
# fält, så en exempelfil som glidit isär från koden ger en tom konfiguration och
# en collector som tyst gör ingenting — därför testas det istället för att läsas.

# ---------------------------------------------------------------------------
# Mailkonton (IMAP)
#
# Hämtas alltid med PEEK, så inga \Seen-flaggor ändras vid läsning. Ett mail
# markeras som läst först när det vidarebefordrats (se Collector.markSeen).
# ---------------------------------------------------------------------------
sources:
  - name: personal-gmail
    host: imap.gmail.com
    port: 993
    tls: true
    username: din.adress@gmail.com
    password_env: GMAIL_APP_PASSWORD_PERSONAL # App-lösenord, inte kontolösenord
    folder: INBOX

  # Ytterligare konton får varsin egen env-variabel — dela aldrig en.
  # - name: work-gmail
  #   host: imap.gmail.com
  #   port: 993
  #   tls: true
  #   username: jobb.adressen@gmail.com
  #   password_env: GMAIL_APP_PASSWORD_WORK
  #   folder: INBOX

# ---------------------------------------------------------------------------
# Destinationer
#
# type: smtp              — vidarebefordran via SMTP till `address`
#       fortnox-receipts  — uppladdning till Fortnox kvitto-inbox
#       fortnox-invoices  — uppladdning till Fortnox leverantörsfaktura-inbox
# ---------------------------------------------------------------------------
destinations:
  - name: mynt
    type: smtp
    address: kvitto+DITT-HASH@mynt.se

  - name: fortnox-receipts
    type: smtp
    address: inbox.ver.DITT-ORGNR@arkivplats.se

  - name: fortnox-invoices
    type: smtp
    address: inbox.lev.DITT-ORGNR@arkivplats.se

# ---------------------------------------------------------------------------
# Routingregler — utvärderas i ordning, första träff vinner.
#
# match_from     — exakt adress, eller *@domän
# match_subject  — delsträng, skiftlägesokänslig
#
# Kriterier ANDas; alternativ inom ett kriterium ORas. En regel som anger både
# match_from och match_subject kräver alltså BÅDA. Utelämnat kriterium är inte
# en begränsning, så en regel med bara match_from matchar oavsett ämnesrad.
#
# destination: ""  — släng uttryckligen (regeln matchar, inget vidarebefordras)
# ---------------------------------------------------------------------------
rules:
  # --- Släng först: en droppregel efter en bredare regel nås aldrig ---
  - name: ignore-apple-price-change
    match_from: ["*@email.apple.com"]
    match_subject: ["price change", "prisändring"]
    destination: ""

  # --- Leverantörsfakturor → Fortnox ---
  - name: hetzner-invoice
    match_from: ["*@hetzner.com"]
    match_subject: ["Invoice", "Faktura"]
    destination: fortnox-invoices

  - name: bahnhof-invoice
    match_from: ["*@bahnhof.se"]
    destination: fortnox-invoices

  - name: telenor-invoice
    match_from: ["*@telenor.se"]
    destination: fortnox-invoices

  - name: telia-invoice
    match_from: ["*@telia.se"]
    destination: fortnox-invoices

  # BMW Financial Services kommer via Kivra-vidarebefordran, så avsändaren är
  # Kivra och inte BMW — matcha på ämnesraden också.
  - name: bmw-financial-services
    match_from: ["*@kivra.com", "*@kivra.se"]
    match_subject: ["BMW"]
    destination: fortnox-invoices

  - name: workforcelogiq-invoice
    match_from: ["*@workforcelogiq.com"]
    destination: fortnox-invoices

  - name: soderberg-partners
    match_from: ["*@soderbergpartners.se"]
    destination: fortnox-invoices

  # --- Korttransaktioner → Mynt ---
  # Google sends payment receipts from payments-noreply@ under subjects well
  # outside the two originally listed. Match the payments sender on its own and
  # keep the subject constraint only for the general google.com address, which
  # also carries account and product mail.
  - name: google-payments-receipt
    match_from: ["payments-noreply@google.com"]
    destination: mynt

  - name: google-play-receipt
    match_from: ["*@google.com"]
    match_subject: ["Kvitto på din beställning", "Google Play order receipt", "payment receipt"]
    destination: mynt

  # The subject allowlist was too narrow — three forwarded Apple receipts
  # matched none of it. "receipt"/"kvitto"/"faktura" covers the variants without
  # opening the rule to Apple's marketing, which the drop rule above catches.
  - name: apple-receipt
    match_from: ["*@email.apple.com"]
    match_subject: ["invoice", "faktura", "kvitto", "receipt"]
    destination: mynt

  - name: amazon-receipt
    match_from: ["*@amazon.se", "*@amazon.com"]
    match_subject: ["Your order", "Din beställning", "order confirmation"]
    destination: mynt

  - name: spotify-receipt
    match_from: ["*@spotify.com"]
    match_subject: ["receipt", "kvitto"]
    destination: mynt

  - name: easypark-receipt
    match_from: ["*@easypark.net"]
    destination: mynt

  # Parkster is a .se domain. The .com pattern never matched a single message.
  - name: parkster-receipt
    match_from: ["*@parkster.se", "*@parkster.com"]
    destination: mynt

  - name: nextory-receipt
    match_from: ["*@nextory.com"]
    destination: mynt

  - name: bonnier-svd-receipt
    match_from: ["*@bonniernews.se", "*@svd.se"]
    destination: mynt

  - name: sats-receipt
    match_from: ["*@sats.com"]
    destination: mynt

  - name: berget-receipt
    match_from: ["*@berget.ai"]
    destination: mynt

  - name: perplexity-receipt
    match_from: ["*@perplexity.ai"]
    destination: mynt

  - name: elevenlabs-receipt
    match_from: ["*@elevenlabs.io"]
    destination: mynt

  # Invoices arrive from the mail.anthropic.com SUBDOMAIN. `*@anthropic.com`
  # matches the apex only, so this rule matched nothing for its whole life.
  - name: anthropic-receipt
    match_from: ["*@anthropic.com", "*@mail.anthropic.com"]
    destination: mynt

  # --- Betalningsförmedlare (köpmannen står i ämnesraden, inte avsändaren) ---
  # Ground truth: 2026-09-09 audit of 209 receipts forwarded by hand to Mynt.
  # 39 senders matched no rule at all; these are the ones that recurred.
  - name: stripe-receipt
    match_from: ["*@stripe.com"]
    destination: mynt

  - name: paddle-receipt
    match_from: ["*@paddle.com"]
    destination: mynt

  - name: zettle-receipt
    match_from: ["*@zettle.com"]
    destination: mynt

  # --- Resor, parkering, vägavgifter ---
  - name: uber-receipt
    match_from: ["*@uber.com"]
    destination: mynt

  - name: sas-receipt
    match_from: ["*@flysas.com"]
    destination: mynt

  - name: booking-receipt
    match_from: ["*@booking.com", "*@property.booking.com"]
    destination: mynt

  - name: omio-receipt
    match_from: ["*@omio.com"]
    destination: mynt

  - name: aimopark-receipt
    match_from: ["*@aimopark.io"]
    destination: mynt

  - name: taxistockholm-receipt
    match_from: ["*@taxistockholm.se"]
    destination: mynt

  - name: asfinag-receipt
    match_from: ["*@asfinag.at"]
    destination: mynt

  # --- SaaS ---
  - name: onepassword-receipt
    match_from: ["*@1password.com"]
    destination: mynt

  # Mistral sends from two different subdomains — a merchant list reliably
  # misses the second one.
  - name: mistral-receipt
    match_from: ["*@mistral.ai", "*@emails.mistral.ai"]
    destination: mynt

  - name: github-receipt
    match_from: ["*@github.com"]
    match_subject: ["receipt", "payment", "invoice"]
    destination: mynt

  - name: audible-receipt
    match_from: ["*@audible.com"]
    match_subject: ["receipt", "kvitto", "order"]
    destination: mynt

  - name: evernote-receipt
    match_from: ["*@mg.evernote.com"]
    destination: mynt

  # --- Kvitton utan kortknytning → Fortnox ---
  - name: wolt-receipt
    match_from: ["*@wolt.com"]
    destination: fortnox-receipts
