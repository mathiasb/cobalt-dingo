name: agent run

# Prototype of the agent-in-CI substrate (2026-08-27).
#
# The bet: the trigger, RBAC, audit trail, isolation and rollback should come
# from the CI platform rather than from a bespoke dispatcher. dispatch's watcher
# reimplemented all five and produced three control-plane defects in one day of
# real use (dispatch#53, #54, #55) plus an eight-week silent outage. Its
# EXECUTOR, by contrast, produced five commits with green CI — so this keeps the
# executor (`dispatch run`) and deletes the rest.
#
# What the platform gives us for free here:
#   trigger   — issues.labeled, no polling CronJob to go silently dead
#   RBAC      — who may apply the label is Gitea's permission model
#   audit     — one Actions run per attempt, linked to the issue, retained
#   isolation — the runner, not a shared long-lived pod
#   rollback  — revert the PR
#
# THE AGENT NEVER PUSHES. It edits files in the checkout; this job creates the
# branch, commits, and opens the PR. That is the important difference from the
# issue flow, where the agent held a push credential and pushed to main. Agent
# edits to workflows or tests now arrive as a reviewable diff behind branch
# protection (dispatch#55).
#
# Deliberately NOT `status:dispatch`: this repo is still in dispatch-repos.txt,
# so reusing that label would fire the CronJob and this workflow for the same
# issue.
#
# REQUIRED SECRETS (all set on this repo since 2026-09-02):
#   LITELLM_API_KEY         — gateway key. A rotated one fails the run in ~60ms
#                             with a LiteLLM 401 indistinguishable from a
#                             missing key, and nothing alerts on it.
#   LITELLM_BASE_URL        — http://litellm.ai-stack.svc.cluster.local:4000/v1
#   DISPATCH_BOT_TOKEN_RO   — read:repository + read:issue, dispatch-bot account
#
# The runner is an in-cluster pod (`gitea-runner` namespace), so the service DNS
# resolves and there are no NetworkPolicies in either namespace to block it.
# This is the same URL the dispatch CronJob already uses successfully.

on:
  issues:
    types: [labeled]

concurrency:
  # One agent run per issue. Also stops a label-flap from starting a fleet.
  group: agent-run-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    # RESUMED 2026-09-03 (dispatch#67, risk/high). Was `if: false` after run 5228
    # against cobalt-dingo#14 proved "THE AGENT NEVER PUSHES" (line 19) false:
    # the agent used the GITEA_TOKEN handed to the "Run the agent" step to write
    # straight to main via the gitea MCP write tool, bypassing the run_bash
    # denylist that was supposed to be the only push-capable surface. Resuming
    # now that fix #1 has landed (dispatch@0044a4f): `dispatch run`'s CI path
    # constructs its executors with CIPolicy, not DefaultPolicy, and CIPolicy
    # has no forge-mutating MCP tool at all — file_write_branch is not merely
    # denylisted, it is not granted. Fix #4 below is the verifier: it does not
    # trust that claim, it checks origin/main directly.
    #
    # Fix #2 landed 2026-09-05: the two steps that hand a credential to the
    # UNTRUSTED agent now use `secrets.DISPATCH_BOT_TOKEN_RO`, a token owned by
    # the dedicated `dispatch-bot` account and scoped `read:repository` +
    # `read:issue`. Read-only comes from the SCOPE, not from per-repo
    # permission: scope is the half that travels with the token, so a
    # read-only-by-permission credential would still be push-capable against
    # every other repo its account can write to -- the escape would relocate
    # rather than close. Verified before wiring: GetIssue 200, clone OK, and a
    # real `git push` REFUSED.
    #
    # The "Open a PR" step below deliberately KEEPS the write-capable
    # secrets.GITEA_TOKEN. That credential is the JOB's, used after the agent
    # has finished, and opening the PR is the one thing the design requires be
    # writable. Do not "tidy" it to the read-only token.
    #
    # The secret is NOT named GITEA_TOKEN_RO as dispatch#67 originally proposed:
    # Gitea reserves the GITEA_/GITHUB_ secret-name prefix and rejects creating
    # one with 400 invalid variable or secret name. The env var inside each step
    # is still GITEA_TOKEN, which is what `dispatch run` reads.
    #
    # Still not done here (issue's fix #5): not trusting the agent's own summary
    # line is a downstream-consumer discipline change, not a workflow change.
    # PAUSED 2026-09-07 after run 5915 on issue #11 escaped a second time, and
    # RESUMED 2026-09-15 once both halves of that escape were closed.
    #
    # The pause comment blamed "a hosted MCP server carrying its own
    # credential". That was wrong, and is corrected here rather than left to
    # mislead the next reader: the agent used plain `git commit` + `git push`
    # from the checkout. Two things had to be true at once, and each is now
    # false independently --
    #
    #   CAPABILITY: CIPolicy rewrote MCPTools but inherited BashPrefixes
    #   verbatim, and DefaultPolicy carries a bare "git", which authorises
    #   `git push` as much as `git status`. Only COMPOUND commands were ever
    #   refused (the log shows `|` and `&&` denied); the escape used neither.
    #   Closed by dispatch#72: CI mode gets git status|diff|log|show.
    #
    #   CREDENTIAL: actions/checkout had planted a write-capable auth header
    #   in .git/config. Closed by persist-credentials: false above.
    #
    # Fix #4 below stays exactly as it is. It caught BOTH escapes within a
    # minute, because it checks the fact rather than trusting the policy --
    # including on this resume, where the policy is once again believed correct.
    if: >-
      github.event.label.name == 'agent/ci-run' ||
      contains(github.event.issue.labels.*.name, 'agent/ci-run')
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dispatch#67 round two. By default this action writes
          #   http.<host>.extraheader = AUTHORIZATION: basic ***
          # -- the JOB's write-capable token -- into .git/config, and only
          # strips it in a post-step that runs AFTER the agent has finished.
          # For the whole agent window the untrusted model sits inside a
          # repository that can push to main with no credential of its own.
          # That is how run 5915 escaped while the read-only PAT handed to the
          # agent step (fix #2) was working exactly as designed: that variable
          # was never the credential in play. The PR step supplies its own.
          persist-credentials: false

      # dispatch#67 fix #4, the verifier for fix #1. "The agent's tools no
      # longer include a forge write" is a claim about CIPolicy; this checks
      # the fact CIPolicy exists to guarantee, independent of trusting the
      # policy code, the executor's own report, or anything the agent said.
      # Per the estate's own rule, a gate without a case proving it fails when
      # it should is a claim, not a control -- this is that case.
      - name: Record origin/main before the agent runs
        run: git rev-parse origin/main > /tmp/main-before.txt

      - name: Build the executor
        env:
          GITEA_TOKEN: ${{ secrets.DISPATCH_BOT_TOKEN_RO }}
        # The runner's filesystem PERSISTS between jobs — a fixed clone path
        # works on the first run and fails on every one after with
        # "destination path already exists". Unique dir per run; the binary
        # path is a file so overwriting it is fine.
        run: |
          set -euo pipefail
          git config --global credential.helper '!f() { echo username=ci; echo password=$GITEA_TOKEN; }; f'
          src="$(mktemp -d)"
          git clone --depth 1 https://git.d-ma.be/mathias/dispatch.git "$src"
          ( cd "$src" && go build -o /tmp/dispatch-bin ./cmd/dispatch )
          /tmp/dispatch-bin run 2>&1 | head -1 || true

      - name: Run the agent
        env:
          GITEA_TOKEN: ${{ secrets.DISPATCH_BOT_TOKEN_RO }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          # infra#347/dispatch#68: repointed from the dead berget/kimi-k2.6.
          LITELLM_EXECUTORS: "kimi=berget/kimi-k3,qwen=koala/qwen36-35b-a3b,glm=berget/glm-4.7-fp8"
          DISPATCH_KIMI_MAX_TURNS: "80"
        # Exit status is the contract: non-zero means no work happened, and the
        # job stops rather than opening an empty PR.
        run: /tmp/dispatch-bin run ${{ github.repository }} ${{ github.event.issue.number }} .

      # dispatch#67 fix #4. Independent of the diff check below: a forge write
      # does not touch this checkout's working tree at all, so a clean `git
      # diff` here is exactly what run 5228 saw while a commit was landing on
      # main through a different door. Fails the job outright -- this is not
      # "no PR to open", it is "the sandbox did not hold".
      - name: Assert origin/main did not move
        # Runs even if "Run the agent" itself failed. A step-failure default
        # would skip this on exactly the run where an escape is most plausible
        # -- the agent doing something out-of-band and THEN erroring out never
        # gets checked otherwise.
        if: always()
        run: |
          git fetch origin main -q
          before="$(cat /tmp/main-before.txt)"
          after="$(git rev-parse origin/main)"
          if [ "$before" != "$after" ]; then
            echo "::error::origin/main moved during the run ($before -> $after)." \
                 "The agent wrote to the forge outside this job's own commit/PR path." >&2
            exit 1
          fi

      - name: Open a PR if the agent changed anything
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            # dispatch#67 fix #3: "no changes" used to exit 0. The job cannot
            # distinguish "the agent did nothing" from "the agent did it
            # somewhere this checkout can't see" -- run 5228 was the second
            # case wearing the first case's exit code. Fail and let a human
            # look; a genuinely idle run costs one red job, which is cheap
            # next to what a silent one already cost.
            echo "::error::agent made no changes in the checkout — nothing to open." \
                 "Verify by hand this was truly a no-op before treating it as one." >&2
            exit 1
          fi
          branch="agent/issue-${{ github.event.issue.number }}"
          git config user.name  "agent-ci"
          git config user.email "agent-ci@d-ma.be"
          git checkout -b "$branch"
          git add -A
          git commit -m "agent: address #${{ github.event.issue.number }}" -m "Opened by the agent-run workflow. Closes nothing automatically — a human reviews, merges and closes."
          # Push over SSH, not HTTPS. persist-credentials: false left this
          # checkout with no auth, and the obvious replacement -- a credential
          # helper feeding secrets.GITEA_TOKEN -- gets 403: the Actions token
          # is not push-capable on this instance (run 7157 committed
          # agent/issue-15 fine, then "fatal: ... The requested URL returned
          # error: 403").
          #
          # SSH from the runner is the pattern the rest of the estate already
          # uses for exactly this: dispatch's own CD pins the infra manifest
          # via ssh://git@10.0.1.20:30022 and notes "every repo's self-hosted
          # runner -- no new credential needed here". Port 30022 is the
          # NodePort gitea actually serves SSH on; the advertised port 22 is
          # refused.
          #
          # This does not hand the agent a push path: `git push` and `git
          # remote` are both outside CIPolicy's git verbs (dispatch#72), and
          # this step runs after the agent has finished.
          git push "ssh://git@10.0.1.20:30022/${{ github.repository }}.git" "$branch"
          curl -sS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"head\":\"$branch\",\"base\":\"main\",\"title\":\"agent: #${{ github.event.issue.number }} ${{ github.event.issue.title }}\",\"body\":\"Opened by \`agent-run\` for #${{ github.event.issue.number }}.\\n\\nCI is the ground-truth verdict. A human reviews, merges and closes — this workflow does none of those.\"}" \
            "https://git.d-ma.be/api/v1/repos/${{ github.repository }}/pulls"
